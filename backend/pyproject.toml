[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tasleem"
version = "0.2.0"
description = "Verified screening-to-care follow-through: case ownership, stall detection, barrier recovery and evidence-based closure beside Malaffi."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135",
  # Security floors from pip-audit (17 Nov 2026): starlette advisories fixed in 1.3.1.
  "starlette>=1.3.1",
  "certifi>=2026.10.18",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5.0"]
# The AI agent's optional LLM provider. Without it (or without a key) the agent runs on templates.
# Upper bound: the adapter was written against the 0.x SDK surface (beta.messages.parse + output_format).
agent = ["anthropic>=0.105,<1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
# One repository, several deployable services: tasleem (case-core API + scheduler), tasleem_notifier,
# tasleem_agent, tasleem_connector, and the shared tasleem_common library.
include = ["tasleem*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic; reviewed, not hand-wrapped.
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are designed to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Header", "fastapi.Query"]
