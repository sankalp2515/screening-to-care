<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Close case dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&amp;family=Libre+Franklin:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
:root{--ease-out:cubic-bezier(0.23,1,0.32,1)}
h1,h2{font-family:'Source Serif 4',Georgia,serif;font-weight:600;letter-spacing:-0.012em}
[lang=ar] h1,[lang=ar] h2{font-family:'IBM Plex Sans Arabic',sans-serif;letter-spacing:0}
button,.btn,.pbtn,.opt,.bchip,.out,[role=button]{transition:transform 160ms var(--ease-out),background-color 150ms ease,border-color 150ms ease,color 150ms ease}
button:active,.btn:active,.pbtn:active,.bchip:active{transform:scale(0.97)}
.opt:active,.out:active{transform:scale(0.98)}
:focus-visible{outline:2px solid #1A4BE0;outline-offset:2px}
@media (prefers-reduced-motion:reduce){button:active,.btn:active,.pbtn:active,.opt:active,.bchip:active,.out:active{transform:none}}

body{margin:0;background:#FAF8F3}
a{color:#1A4BE0}a:hover{color:#1238B0}
.tl{font-family:'Libre Franklin',system-ui,sans-serif;color:#14171F;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.rule{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:600;color:#B42318;background:#FEF3F2;border-radius:2px;padding:1px 6px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border-radius:4px;font:inherit;box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:4px;font-weight:600;font-size:14px;text-decoration:none;border:1px solid #D5CFC2;background:#fff;color:#3A3E47;cursor:pointer;font-family:inherit;box-sizing:border-box}
.btn-p{background:#1A4BE0;border-color:#1A4BE0;color:#fff}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:600;color:#3A3E47}
.dlg{opacity:1;transform:none;transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
@starting-style{.dlg{opacity:0;transform:scale(0.97)}}
.reveal{opacity:1;transform:none;transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
@starting-style{.reveal{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.dlg,.reveal{transform:none!important}}
.sig{display:inline-flex;flex-direction:column;gap:2px}.sig b{font-size:15px;font-weight:600;color:#14171F}.sig i{display:block;height:2px;width:120px;background:#1A4BE0;border-radius:1px}
.fld input,.fld textarea{font:inherit;font-size:14px;padding:10px 12px;border:1px solid #D5CFC2;border-radius:4px;color:#14171F;background:#fff}
</style>
</helmet>
<div class="tl" style="position: relative; width: 100%; min-height: 100vh; background: #FAF8F3; overflow: hidden">

<div aria-hidden="true" style="padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; max-width: 1400px; margin: 0 auto; box-sizing: border-box">
<div style="height: 36px; width: 280px; border-radius: 4px; background: #E7E2D7"></div>
<div style="height: 96px; border-radius: 4px; background: #FEF4EC"></div>
<div style="display: flex; gap: 24px; flex-wrap: wrap">
<div style="flex: 999 1 640px; height: 640px; border-radius: 4px; background: #fff; border: 1px solid #E7E2D7"></div>
<div style="flex: 1 1 380px; height: 640px; border-radius: 4px; background: #fff; border: 1px solid #E7E2D7"></div>
</div>
</div>

<div style="position: absolute; inset: 0; background: rgba(20,23,31,.55); display: flex; align-items: flex-start; justify-content: center; padding: 56px 16px; box-sizing: border-box">
<section class="dlg" role="dialog" aria-modal="true" aria-labelledby="close-title" style="width: 100%; max-width: 620px; background: #fff; border-radius: 6px; box-shadow: 0 0 0 1px #D5CFC2; display: flex; flex-direction: column; overflow: hidden">
<header style="padding: 22px 24px 16px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; border-bottom: 1px solid #E7E2D7">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="close-title" style="margin: 0; font-size: 19px; font-weight: 650">Close Rajesh K.'s case</h2>
<p style="margin: 0; font-size: 14px; color: #545862">Choose the outcome. Each one needs the evidence or decision the rules require.</p>
</div>
<a href="CaseView.dc.html" aria-label="Close dialog" style="width: 36px; height: 36px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: #6B6F78"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></a>
</header>

<div style="padding: 18px 24px; display: flex; flex-direction: column; gap: 10px" role="radiogroup" aria-label="Outcome">
<sc-for list="{{outcomes}}" as="o" hint-placeholder-count="5">
<sc-if value="{{o.allowed}}" hint-placeholder-val="{{ true }}">
<sc-if value="{{o.selected}}" hint-placeholder-val="{{ false }}">
<button type="button" role="radio" aria-checked="true" class="opt" onClick="{{o.pick}}" style="border: 1.5px solid #1A4BE0; background: #EEF1FC; cursor: pointer">
<span style="width: 18px; height: 18px; border-radius: 50%; border: 5px solid #1A4BE0; box-sizing: border-box; flex-shrink: 0; margin-top: 1px"></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600; color: #14171F">{{o.label}}</span><span style="font-size: 13px; color: #545862">{{o.hint}}</span></span>
</button>
</sc-if>
<sc-if value="{{o.unselected}}" hint-placeholder-val="{{ true }}">
<button type="button" role="radio" aria-checked="false" class="opt" onClick="{{o.pick}}" style="border: 1px solid #D5CFC2; background: #fff; cursor: pointer">
<span style="width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #A29D91; box-sizing: border-box; flex-shrink: 0; margin-top: 1px"></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600; color: #14171F">{{o.label}}</span><span style="font-size: 13px; color: #545862">{{o.hint}}</span></span>
</button>
</sc-if>
</sc-if>
<sc-if value="{{o.blocked}}" hint-placeholder-val="{{ false }}">
<div role="radio" aria-checked="false" aria-disabled="true" class="opt" style="border: 1px dashed #D5CFC2; background: #FAF8F3">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A29D91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 600; color: #6B6F78">{{o.label}}</span><span style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: #B42318"><span class="rule">R3</span>{{o.message}}</span></span>
</div>
</sc-if>
</sc-for>
</div>

<div style="padding: 0 24px 18px; display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{needEvidence}}" hint-placeholder-val="{{ true }}">
<div class="fld reveal"><label for="ev">Evidence reference</label><input id="ev" class="mono" type="text" placeholder="e.g. DiagnosticReport/colo-2026-118"><span style="font-size: 12px; color: #6B6F78">The FHIR reference of the report or document that proves this outcome.</span></div>
</sc-if>
<sc-if value="{{needReason}}" hint-placeholder-val="{{ false }}">
<div class="fld reveal"><label for="rs">Clinical reason</label><textarea id="rs" rows="3" placeholder="Why this outcome is right for this patient"></textarea></div>
</sc-if>
</div>

<footer style="padding: 16px 24px; border-top: 1px solid #E7E2D7; background: #FAF8F3; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<span style="display: flex; align-items: flex-end; gap: 12px"><span class="sig"><span style="font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #6B6F78">Signing as</span><b>Dr. Fatima, family physician</b><i aria-hidden="true"></i></span><span style="font-size: 12px; color: #6B6F78">Written to the audit log <span class="mono">R6</span></span></span>
<span style="display: flex; gap: 8px"><a href="CaseView.dc.html" class="btn">Cancel</a><button type="button" class="btn btn-p">Close case</button></span>
</footer>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'COMPLETED_ELSEWHERE' };
  }
  renderVals() {
    const base = [
      { id: 'COMPLETED_WITH_REPORT', label: 'Completed, report received', allowed: false, message: 'Required clinical evidence has not been received.', requires: [] },
      { id: 'COMPLETED_ELSEWHERE', label: 'Completed elsewhere', allowed: true, hint: 'Needs an evidence reference', requires: ['evidence_ref'] },
      { id: 'PLAN_CHANGED', label: 'Plan changed', allowed: true, hint: 'Needs a clinical reason', requires: ['reason'] },
      { id: 'INFORMED_REFUSAL', label: 'Informed refusal', allowed: true, hint: 'Needs an evidence reference and a reason', requires: ['evidence_ref', 'reason'] },
      { id: 'UNREACHABLE', label: 'Unreachable', allowed: false, message: 'UNREACHABLE needs at least 3 contact attempts and one escalation.', requires: [] }
    ];
    const picked = this.state.picked;
    const outcomes = base.map((o) => ({
      ...o,
      blocked: !o.allowed,
      selected: o.allowed && o.id === picked,
      unselected: o.allowed && o.id !== picked,
      pick: () => this.setState({ picked: o.id })
    }));
    const cur = base.find((o) => o.id === picked) || { requires: [] };
    return {
      outcomes,
      needEvidence: cur.requires.indexOf('evidence_ref') !== -1,
      needReason: cur.requires.indexOf('reason') !== -1
    };
  }
}
</script>
</body>
</html>
