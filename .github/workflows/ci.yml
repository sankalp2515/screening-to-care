# CI (backlog TSL-004): lint, tests, benchmarks, migrations against Postgres, then the whole stack in
# Docker with the end-to-end smoke test. Synthetic data only; no secrets are needed.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: tasleem, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: tasleem}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tasleem" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -c constraints.txt -e ".[dev,postgres,redis,agent]"
      - name: Lint
        run: ruff check .
      - name: Dependency vulnerabilities (pinned set)
        run: pip install pip-audit && pip-audit -r constraints.txt --no-deps
      - name: Unit, integration, API, security and end-to-end tests
        run: python -m pytest -q
      - name: Hard cases (labelled; misses are reported, not hidden)
        run: python -m tasleem.bench.hardcases
      - name: Three-arm benchmark (fixed seeds)
        run: python -m tasleem.bench --n 1000 --seeds 2026,2027,2028
      - name: Migrations on PostgreSQL 16 (fresh database, then a no-op re-run)
        env: {TASLEEM_DATABASE_URL: "postgresql+psycopg://tasleem:ci-only@localhost:5432/tasleem"}
        run: |
          python -m tasleem.migrate
          python -m tasleem.migrate

  stack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Start every service (API, scheduler, notifier, agent, connector, Postgres, Redis)
        run: docker compose up -d --build --wait
      - name: End-to-end smoke across services
        run: cd backend && python -m tasleem.smoke --stack
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -400
