# Static app plus a same-origin gateway to the backend services. Upstreams resolve at request time through
# Docker's DNS, so the app still loads (and shows an honest error) if one service is down or restarting.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx drops server-level add_header in any location that sets its own, so every such location
    # includes the same security headers.
    include /etc/nginx/conf.d/security.inc;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    set $core      api:8000;
    set $agent     agent:8020;
    set $notifier  notifier:8010;
    set $connector connector:8030;

    location /api/core/      { rewrite ^/api/core/(.*)$ /$1 break;      proxy_pass http://$core;      include /etc/nginx/conf.d/proxy.inc; }
    location /api/agent/     { rewrite ^/api/agent/(.*)$ /$1 break;     proxy_pass http://$agent;     include /etc/nginx/conf.d/proxy.inc; }
    location /api/notifier/  { rewrite ^/api/notifier/(.*)$ /$1 break;  proxy_pass http://$notifier;  include /etc/nginx/conf.d/proxy.inc; }
    location /api/connector/ { rewrite ^/api/connector/(.*)$ /$1 break; proxy_pass http://$connector; include /etc/nginx/conf.d/proxy.inc; }

    # Hashed build assets never change; the shell and the demo bundle always revalidate.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/conf.d/security.inc; try_files $uri =404; }
    location = /demo-bundle.json { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/security.inc; try_files $uri =404; }

    # Single-page app: every other path is a client route.
    location / { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/security.inc; try_files $uri $uri/ /index.html; }
}
